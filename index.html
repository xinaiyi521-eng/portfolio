Reveal fix（本次唯一改动范围 = 入场揭示机制 fail-open；版式/型级/配色/栅格/文案/图片 URL 与顺序/路由逐字未动）:
  - CSS 默认改为终态：.rv 不再自带 clip-path/transform（JS 未执行或报错时内容照常全显）；隐藏态改由 JS 施加的预备类
    .rv.pre 承载（clip-path:inset(0 0 100% 0);transform:translateY(16px);transition:clip-path .9s var(--ease),transform .9s var(--ease)），
    终态类 .rv.on（clip-path:inset(0 0 0 0);transform:none），选择器写作 .rv.pre.on,.rv.on 以压过 .rv.pre
  - 观察器放宽：threshold 0.12 -> 0，rootMargin "0px 0px -6% 0px" -> "0px 0px -4% 0px"；stagger 仍为同批回调内 i*60ms，
    上限 8 项，第 9 项起一律 0ms（防长列表末尾延迟累积）
  - sweep(root)：把 root 内所有 .rv.pre:not(.on) 补 .on 并 unobserve。触发时机 = ①每次视图 mount 后 rAF（用双 rAF 落到第 2 帧，
    让 IO 的首帧回调先跑完，否则会抢掉入场 stagger）②mount 后 900ms ③mount 后 2000ms ④window.load ⑤resize（150ms 去抖）
    ⑥orientationchange（立即 + 150ms）⑦visibilitychange 变 visible ⑧beforeprint 与 matchMedia("print") 命中
    ⑨cleanupView 移除旧视图前；另加 @media print 全显覆盖，保证打印/导出 PDF 无裁切痕迹
  - bindReveals 由「.enter 之后」提前到「appendChild 之后、window.scrollTo 与 .enter 之前」执行，保证 .pre 在任何一次
    强制样式解析（scrollTo 会 flush layout）之前落定，杜绝「先可见再被裁掉」的闪烁；带 data-plx 的节点一律不加 .pre
    （inline transform 归视差 plxLoop 独占，两者互不覆盖）
  - 无 IntersectionObserver 支持（或控制台将其替换为抛错/不回调的实现）时 bindReveals 直接 sweep；prefers-reduced-motion 路径行为不变（不加 .pre，直接 .on，
    原 @media (prefers-reduced-motion:reduce) 对 .rv 的 clip-path/transform !important 覆盖保留为最后一道 CSS 级保险）
  - 已知取舍：900ms/2000ms 的兜底 sweep 是全量补 .on，因此首屏以下条目在挂载 2 秒后即处于终态、不再保留滚动触发的行遮罩；
    入场观感（首屏标题/tagline/案例名/首图 + 60ms stagger + 0.7s 视图转场）与修复前一致

    写回后触发的下一条记录里该值已是空串 -> 条件不成立 -> 不再写入，自然收敛，因此不需要 disconnect/重连

    即使原生跳转被编辑层吞掉，路由仍会切换；href 与当前 hash 相同时不干预，保持既有行为。该监听无条件注册

  - 删除清单（8 处）：①CSS .figbar / .figbar .fb-id / .figbar .fb-n 三条规则 + 其上方 Interaction fix B 分节注释
    ②@media print 内 .figbar{display:none!important} 一行（同块 .lb / img.img-fade / .pdfwrap / .pdf-print 等其余各行逐字保留）
    ③JS 函数 figBarMake 整体（bar / idS / nS / paint / return {node,set}）
    ④JS 函数 figProgressMake 整体（IO 创建、nodes/cur/paintAt、observe、无 IO 的 scroll+rAF 兜底 fallback/calc/kick、bind、destroy）——
      它唯一消费者是被删的 fb.set，留着即死代码
    ⑤JS 分节注释「Interaction fix B：sticky 项目标识 + 进度计数」四行说明
    ⑥viewDetail 内 4 行：var fb=figBarMake(...)、v.insertBefore(fb.node,fgsNode)、var fprog=figProgressMake(fb.set)、v._figProgress=fprog；
      紧随其后的 var fgsNode=v.querySelector("#figs") 保留（下方 var figs=fgsNode 与 wideFigs 的 classList.add("wide") 仍消费它），
      其上的 var imgList=p.imgs||[] 保留（addFig / batch / lbOpen 路径仍消费）
    ⑦addFig 内 fprog.observe(fig) 一行 + batch 内 fprog.bind() 一行 —— fprog 已不存在，留着会抛 ReferenceError 打断整个详情页渲染（本轮头号风险点）
    ⑧cleanupView 内 if(v._figProgress)v._figProgress.destroy(); 一行（同函数 lbClose() / _pdfCleanup / sweep(v) / plxForget 等其余各行逐字保留）
  - 保留项：figText 与 pad2（放大层控制条序号文案的唯一来源，格式 {编号} {案例名} · {序号} / {总数}，例「01 五大禅林 · 07 / 14」）；
    放大层（A 项）全部代码与样式（.fig-zoom / .lb / .lb-stage / .lb-img / .lb-cap / .lb-close、fit/maxS/zoomAt/show/clampPan/apply/lbClose、
    缩放上限 maxS=naturalWidth/(iw*fitS) 严格卡 100% 原始像素、双击切换、拖拽平移、触屏原生 pinch、focus trap、三种关闭、overflow 逐字还原、
    键盘分层、#cursor 的「放大」态）；封面第二层 crossfade（C 项）；.aw-row 奖项列 hover（D1）与 imgFade 图片淡入（D2，1200ms 兜底 + fail-open）；
    capApplyNow 防模糊上限；reveal/sweep fail-open 全套；编辑层隔离四件套；wideFigs 与 .figs.wide 全部 CSS；
    三案例 imgs 46 条与三份 imgsLegacy、三 pdfUrl:"" 与 PDF 内嵌休眠代码、首页与关于页全部内容、顶/底栏、document.title 映射、所有既有 data-lvt-eid
  - 未引入任何形式的替代计数：无顶部细线、无角落浮字、无进度条、无滚动百分比、无页码浮层；顶栏仍 fixed 无背景（母版既定设计，未加背景/毛玻璃/backdrop-filter/渐变遮罩）
  - 版式结果：详情页 DOM = 「← 返回作品」→ metaLabel 行 → 项目标题(左)+项目简介(右，含色板) → 图序容器 #figs → …… → 「下一个项目」；
    简介与第一张图之间的垂直间隙回到全站标准 40px（= .fig 的 margin-top），未为补回白条让出的 48px 新增任何 margin/padding/占位元素；
    滚动时图片可从 64px fixed 顶栏下方穿过（顶栏无背景，属既定设计，不作「修复」）
  - 零新增颜色、零新增型级、零新增动效、零新增图片 URL、零新增 data-lvt-eid；全站 a.lovart.ai/artifacts/user/*.jpg 数组内引用仍为 46 条

Display clip fix（本次唯一改动范围 = .display 的 padding/margin 成对补偿 + 本段注释；其余全部逐字未动）:
  - 起因：用户要求「把网站中“案例”和“关于”这几个字显示完整，底部不能被遮挡」
  - 实测根因（渲染截图取证，非代码推断）：①给 .display 临时加背景色块可视化其边框盒，首页「案例」字形底部横笔恰在色块（=边框盒）
    底边处被水平切断，色块上下边之外无字形；②再临时对 .rv.pre.on,.rv.on 加 clip-path:none!important 后同一位置字形底部完整伸出
    色块底边之下 -> 裁切确由 reveal 终态 clip-path:inset(0 0 0 0) 按边框盒裁切所致（clip-path 的 inset 参照 border-box），
    而非祖先 overflow（两标题祖先链 .grid/.index-head / .about-grid/.about-right/.view/main 均无 overflow 容器）；
    机理 = .display{line-height:.92} 使 CJK 字形（em 盒≈1.0em 且字面近满）上下各溢出边框盒约 (1-0.92)/2=0.04em（168px 字号≈6.7px），
    终态裁切把下溢部分切掉。两处临时测量规则测毕已逐字回滚（grep TEMP/QA-MEASURE 零命中）
  - 修复 = .display 规则之后紧邻新增一条 .display{padding-block:.12em;margin-block:-.12em}：padding 计入边框盒 -> 裁切区上下各扩 0.12em
    （≈0.04em 溢出的 3 倍余量，不取卡边值）；等值负 margin 抵掉 -> 元素视觉位置与所占布局高度逐像素不变（成对出现，绝对值严格相等）
  - 【级联补条】实测发现两处实例级 margin 会压掉基配对规则的对应侧：.index-title{margin-top:32px}（同特异性、源码在后）压顶侧、
    .about-right .display{margin-bottom:56px}（0,2,0 更高特异性）压底侧 -> 若只加基规则，这两处实例的 margin 净增 +0.12em、版式位移，
    违反零位移约束；故各补一条实例级规则把既定值与 -.12em 合并重述：.index-title.display{margin-top:calc(32px - .12em)}（同特异性、源码在后取胜）
    与 .about-right .display{margin-bottom:calc(56px - .12em)}（同特异性、源码在后取胜）；两条既有行（32px / 56px）逐字未改，
    语义上 32px 与 56px 的既定间距仍逐像素保留（calc 展开 = 32px + (-0.12em) 与基规则 padding 的 +0.12em 相抵）；
    关于页「关于」的顶侧与首页「案例」的底侧无实例级 margin 覆盖，由基配对规则直接生效
  - line-height:.92 / letter-spacing:-.03em / font-weight:500 / font-size:var(--display-fs) 四项逐字未改（原声明行一字未动，补偿为独立新规则）；
    reveal 的 .rv / .rv.pre / .rv.pre.on,.rv.on 三条 clip-path 值与 rootMargin 逐字未改；.h2 / .body / .label 未动（行高≥1.08 无此问题）
  - .about-left{margin-top:calc(var(--display-fs) * -0.113)} 逐字未动：负 margin 抵掉 padding 后 .about-right 内标题的实际顶边位置不变，
    故左栏第一行顶与「关于」字形顶的同轴关系不变（改前改后关于页同视口截图逐像素比对确认，见交付报告）
  - 全站 .display 实例仅两处：首页 <h1 class="display index-title rv">案例</h1> 与关于页 <h1 class="display rv">关于</h1>（详情页项目名用 .h2）；
    两处同机制受益，字形底部完整可见
  - 打印态与 reduced-motion 态：两态下 .rv 的 clip-path 被既有 !important 覆盖为 none，裁切本不存在；padding/margin 补偿在两态下同样生效且
    不改变版式（等值成对），标题字形完整可读
  - 零新增颜色、零新增型级、零新增动效、零新增图片 URL、零新增元素、零新增 data-lvt-eid
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>李因炘 — 品牌/文创/平面</title>
<style>
:root{
  --bg:#F4F4F4; --fg:#111111; --fg2:#8A8A8A; --line:#DCDCDC; --ph:#EAEAEA;
  --margin:48px; --gap:24px; --bar-h:64px;
  --ease:cubic-bezier(0.16,1,0.3,1);
  --font:"Helvetica Neue","Neue Haas Grotesk Display Pro","PingFang SC","Noto Sans SC","Microsoft YaHei",Arial,sans-serif;
  --display-fs:clamp(72px,12vw,168px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.62;letter-spacing:0;hanging-punctuation:first}
img{border:0}
a{color:inherit;text-decoration:none}
button{font:inherit;background:none;border:0;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
::selection{background:var(--fg);color:var(--bg)}

/* ── 栅格 ───────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--gap);padding-inline:var(--margin)}

/* ── 顶栏 ───────────────────────────── */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--bar-h);z-index:40;
  display:flex;align-items:center;justify-content:space-between;padding-inline:var(--margin);
  mix-blend-mode:normal;background:transparent}
.brand{font-size:13px;font-weight:500;color:var(--fg)}
.topnav{display:flex;align-items:center;gap:28px;font-size:12px;color:var(--fg2)}
.topnav .tag{color:var(--fg2)}
.navlink{position:relative;color:var(--fg2);display:inline-block}
.navlink::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1px;background:var(--fg);transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}
.navlink[aria-current="page"]::after{transform:scaleX(1)}
/* 导航双层翻滚 */
.roll{display:inline-flex;flex-direction:column;overflow:hidden;height:1.5em;vertical-align:top}
.roll span{display:block;height:1.5em;line-height:1.5em;transition:transform .42s var(--ease)}
.navlink:hover .roll span,.navlink:focus-visible .roll span{transform:translateY(-1.5em)}

/* ── 主区 / 视图转场 ─────────────────── */
main{display:block;padding-top:var(--bar-h);padding-bottom:96px;min-height:100vh;outline:none}
.view{transition:opacity .7s var(--ease),transform .7s var(--ease)}
.view.enter{opacity:0;transform:translateY(24px)}
.view.leave{opacity:0;transition:opacity .28s linear}

/* ── 文字行遮罩 reveal（fail-open：CSS 默认即终态可见，隐藏态由 JS 的 .pre 施加） ── */
.rv{clip-path:none;transform:none;opacity:1}
.rv.pre{clip-path:inset(0 0 100% 0);transform:translateY(16px);transition:clip-path .9s var(--ease),transform .9s var(--ease)}
.rv.pre.on,.rv.on{clip-path:inset(0 0 0 0);transform:none}

/* ── 型级 ───────────────────────────── */
.display{font-size:var(--display-fs);font-weight:500;line-height:.92;letter-spacing:-.03em}
.display{padding-block:.12em;margin-block:-.12em} /* Display clip fix：内补 padding 撑大边框盒（clip-path 裁切区随之变大）+ 等值负 margin 抵掉（版式零位移）；成对出现，绝对值严格相等 */
h2.h2,.h2{font-size:clamp(28px,3.2vw,44px);font-weight:500;line-height:1.08;letter-spacing:-.02em}
.body{font-size:16px;line-height:1.62;max-width:46ch}
.body p+p{margin-top:1.2em}
.label{font-size:11px;font-weight:500;color:var(--fg2);letter-spacing:0}
.label.lat{letter-spacing:.14em}

/* ── 返回链接 ───────────────────────── */
.back{position:absolute;top:24px;right:var(--margin);font-size:12px;color:var(--fg2);z-index:5}
.back:hover{color:var(--fg)}

/* ── 视图 1 首页 ────────────────────── */
.index-head{padding-top:40px}
.index-head .row{display:flex;justify-content:space-between;align-items:baseline}
.index-title{grid-column:1/9;margin-top:32px}
.index-title.display{margin-top:calc(32px - .12em)} /* Display clip fix：.index-title 的 margin-top:32px（同特异性、源码在后）会压掉基配对规则的 margin-block 顶侧 -> 在此把既定 32px 与 -.12em 合并重述，使成对抵消逐像素成立；既有行逐字未改 */
.index-tag{grid-column:9/13;align-self:end;font-size:16px;line-height:1.62;color:var(--fg);max-width:46ch}
.cases{margin-top:72px}
.case{display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--gap);padding:64px 0} /* Revamp：.case 升为 12 列栅格容器，使 .case-cover 的 grid-column:3/8 真正生效（旧版 .case 为块容器，3/13 一直是死规则、封面实渲为内容区满宽） */
.case+.case{border-top:1px solid var(--line)}
.case-row{display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--gap);grid-column:1/-1}
.case-no{grid-column:1/3;padding-top:.55em}
.case-name{grid-column:3/10;position:relative;display:inline-block;align-self:start}
.case-name::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:1px;background:var(--fg);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.case-link:hover .case-name::after,.case-link:focus-visible .case-name::after{transform:scaleX(1)}
.case-cat{grid-column:11/13;padding-top:.75em;text-align:left}
.case-cover{display:block;grid-column:3/8;margin-top:28px} /* Revamp: 3/13 -> 3/8（封面宽约缩一半） */
.ph{background:var(--ph);width:100%;position:relative}
.ph.overflowclip{overflow:hidden}
.ph img{display:block;width:100%;max-width:100%;height:auto;border:0;will-change:transform;opacity:1} /* Interaction fix D2：默认态必须不透明（fail-open），隐藏态只由 JS 加 .img-fade 产生 */
/* Interaction fix D2：图片 0.4s 淡入（无 blur / 无缩放 / 无位移 / 无滤镜，只动 opacity） */
img.img-fade{opacity:0}
img.img-fade.in{opacity:1;transition:opacity .4s ease}
.case-cover .ph img{transition:transform .9s var(--ease);transform-origin:center}
.case-link:hover .case-cover .ph img,.case-link:focus-visible .case-cover .ph img{transform:scale(1.035)}
/* Interaction fix C：首页封面 hover 淡入第二层——绝对定位覆盖于底层封面图之上，两层同处 .ph（overflowclip）内且同处 transform 链内部，
   因此上面那条 scale(1.035)（选择器 .case-cover .ph img 同时命中两层）与祖先 .case-cover[data-plx] 的 ±4% 视差对两层同步生效。
   选择器必须写 .case-cover .ph img.hov（0,3,1）且置于此：既压住同特异性的 .case-cover .ph img{transition:transform …}（否则 opacity 过渡被抢掉），
   也压住 img.img-fade.in；第二层只由 hover / :focus-visible 控制可见，无 blur / 无滤镜 / 无位移 / 无缩放过渡 */
.case-cover .ph img.hov{position:absolute;left:0;top:0;width:100%;height:auto;opacity:0;transition:opacity .9s var(--ease)}
.case-link:hover .case-cover .ph img.hov,.case-link:focus-visible .case-cover .ph img.hov{opacity:1}

/* ── 视图 2 关于 ────────────────────── */
.about-wrap{position:relative;padding-top:88px}
.about-grid{display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--gap);padding-inline:var(--margin);align-items:start}
.about-left{grid-column:1/5;margin-top:calc(var(--display-fs) * -0.113)} /* 视觉补偿：Display 行盒负 half-leading 使字形顶高于行盒顶，令左栏与「关于」字形顶同水平线（brief 关键特征） */
.about-right{grid-column:7/13} /* Revamp: 左 1/5 + 右 7/13，两栏之间空出整整一列沟（col 5–6），呼吸感来自沟而非边框 */
.about-right .display{margin-bottom:56px} /* Revamp: 40px -> 56px */
.about-right .display{margin-bottom:calc(56px - .12em)} /* Display clip fix：上行的 margin-bottom:56px（0,2,0）会压掉基配对规则的底侧 -> 本行同特异性、源码在后取胜，把既定 56px 与 -.12em 合并重述；既有行逐字未改 */
/* Revamp：仅关于页右栏的局部正文节奏（全局 .body 仍为 1.62 / 46ch） */
.about-right .body{line-height:1.75;max-width:42ch}
.about-right .body p+p{margin-top:1.6em}
/* Revamp：获奖表三列——赛事 58% 左 / 作品 24% 左 / 奖项 18% 右对齐 */
.aw-head,.aw-row{display:grid;grid-template-columns:58% 24% 18%;align-items:start}
.aw-head{padding-bottom:10px;border-bottom:1px solid var(--line)}
.aw-head .g{text-align:right}
.aw-row{padding:14px 0;border-bottom:1px solid var(--line)}
.aw-row:last-child{border-bottom:0}
.aw-row .l{font-size:13px;line-height:1.5;color:var(--fg);padding-right:20px}
.aw-row .w{font-size:13px;line-height:1.5;color:var(--fg);padding-right:12px}
.aw-row .g{font-size:13px;line-height:1.5;color:var(--fg2);text-align:right;transition:color .25s ease}
/* Interaction fix D1：读到现状 = .l（赛事）与 .w（作品）均为 var(--fg)、仅 .g（奖项）为 var(--fg2) -> 采用「次要列提亮」方案：
   hover 时把 .g 提到 var(--fg)，赛事列保持不动；纯色彩对比，不加背景/hairline/阴影/图标/位移 */
.aw-row:hover .g{color:var(--fg)}
.muted{color:var(--fg2)}
.awards-title{margin-bottom:24px}

/* ── 视图 3 详情 ────────────────────── */
.detail-wrap{position:relative;padding-top:88px}
.detail-meta{display:flex;justify-content:space-between}
.detail-title{grid-column:1/8;margin-top:28px}
.detail-intro{grid-column:8/13;margin-top:28px}
.detail-intro .label{display:block;margin-bottom:14px}
.figs{margin-top:8px}
/* Revamp：详情页单列图序——一律居中、按原序、间距统一（删除 .fig.r 交错与 .fig.full 通栏） */
/* Revamp2 revert：回到 Revamp fix 既定值——8 列宽居中单列（3/11）、图间距 40px */
.fig{grid-column:3/11;margin-top:40px}
.figs.wide .fig{grid-column:2/12} /* Final pages 03 fix：三个案例（wideFigs）均已接入 —— 10 列宽、居中、两侧各留 1 列，图幅统一 */
/* ── PDF embed fix：PDF 原件查看器（视为「图片本体」级嵌入内容，无 border/圆角/阴影/装饰） ── */
.pdfwrap{margin-top:40px}
.pdf-note{grid-column:2/12}
.pdfview{grid-column:2/12;margin-top:20px;height:calc(100vh - var(--bar-h) - 140px);min-height:560px;
  background:var(--ph);overflow:hidden}
.pdfframe{width:100%;height:100%;border:0;display:block} /* 禁加 .rv / clip-path / 视差：clip-path 会裁掉浏览器原生 PDF 工具条 */
.pdf-actions{grid-column:2/12;margin-top:20px}
.pdf-open{font-size:11px;font-weight:500;letter-spacing:0;color:var(--fg)}
.pdf-open:hover,.pdf-open:focus-visible{text-decoration:underline} /* 朴素实现，不新增装饰元素 */
.pdf-fallback-note{grid-column:1/-1;margin-top:8px}
.pdf-print{display:none;padding-inline:var(--margin)} /* 仅打印态可见的明文 URL 行；挂在 .pdfwrap 之外，不随查看器一起被 print 隐藏 */
/* ── Interaction fix A1：详情页图片放大触发层——纯透明按钮，无任何可见装饰 ── */
.fig-zoom{position:absolute;inset:0;z-index:2;background:none;border:0;padding:0;margin:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.fig-zoom:focus-visible{outline:1px solid var(--fg);outline-offset:-1px} /* 全站既有焦点样式语言的内缩变体 */
/* ── Interaction fix A2：放大层（挂 document.body 直接子节点；--bg 实色满屏，非黑色非毛玻璃） ── */
.lb{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column}

  /* 三次兜底：mount 后第 2 帧（双 rAF，让 IO 首帧回调先跑完）、900ms、2000ms */
  requestAnimationFrame(function(){requestAnimationFrame(function(){sweep(scope);});});
  setTimeout(function(){sweep(scope);},900);
  setTimeout(function(){sweep(scope);},2000);

/* 全局兜底触发 */
(function(){
  function sweepDoc(){sweep(document);}
  if(document.readyState==="complete")sweepDoc();
  else window.addEventListener("load",sweepDoc);
  var rt=null;
  function debounced(){clearTimeout(rt);rt=setTimeout(sweepDoc,150);}
  window.addEventListener("resize",debounced);
  window.addEventListener("orientationchange",function(){sweepDoc();debounced();});
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")sweepDoc();});
  window.addEventListener("beforeprint",sweepDoc);
  try{
    var mqp=window.matchMedia("print");
    var onPrint=function(e){if(e.matches)sweepDoc();};
    if(mqp.addEventListener)mqp.addEventListener("change",onPrint);
    else if(mqp.addListener)mqp.addListener(onPrint);
  }catch(err){}
})();

/* ══ 滚动视差（rAF + IO，仅视口内计算） ════════════════ */
var plxSet=new Set(),plxTick=false;
var plxIO=("IntersectionObserver" in window)?new IntersectionObserver(function(entries){
  entries.forEach(function(en){
    if(en.isIntersecting)plxSet.add(en.target);else plxSet.delete(en.target);
  });
  kickPlx();
},{threshold:0}):null;
function plxWatch(node){ if(!REDUCED&&plxIO&&node.hasAttribute("data-plx"))plxIO.observe(node); }
function plxForget(node){ plxSet.delete(node); if(plxIO)plxIO.unobserve(node); }
function kickPlx(){
  if(REDUCED||plxTick||!plxSet.size)return;
  plxTick=true;
  requestAnimationFrame(plxLoop);
}
function plxLoop(){
  plxTick=false;
  if(REDUCED||!plxSet.size)return;
  var vh=window.innerHeight;
  plxSet.forEach(function(node){
    var box=node.getBoundingClientRect();
    if(box.height<=0)return;
    var p=((box.top+box.height/2)-vh/2)/(vh/2+box.height/2); /* -1..1 */
    p=Math.max(-1,Math.min(1,p));
    node.style.transform="translate3d(0,"+(p*-4).toFixed(3)+"%,0)";
  });
  requestAnimationFrame(plxLoop);
}
function watchPlx(scope){
  if(REDUCED||!plxIO)return;
  scope.querySelectorAll("[data-plx]").forEach(plxWatch);
}
window.addEventListener("scroll",kickPlx,{passive:true});

/* ══ 视图构建 ══════════════════════════════════════════ */
function backLink(href,text){return '<a class="back" href="'+href+'">← '+text+'</a>';}

/* figText / pad2：放大层控制条序号文案的唯一来源（原 sticky 白条已整套移除，此二者保留） */
function figText(no,name,cur,total){return {id:pad2(no)+" "+name,n:pad2(cur)+" / "+pad2(total)};}

/* ══ Interaction fix A2：放大层（lightbox）══
   挂在 document.body 直接子节点（不进 #viewHost / #app，避开视图切换清理与编辑层 MutationObserver 守卫）；
   --bg 实色满屏，图自然比例无裁切无变形；缩放上限严格卡在 100% 原始像素（naturalWidth / 适应显示宽），用户无法把图放到糊。
   新增元素一律不带 data-lvt-eid。 */
var LB=null;
function lbOpen(p,idx,seq,trigger){
  lbClose();
  var list=p.imgs||[];
  var total=list.length;
  if(!total||seq<1||seq>total)return;
  var root=el("div","lb");
  root.setAttribute("role","dialog");
  root.setAttribute("aria-modal","true");
  root.innerHTML=
    '<div class="lb-bar">'+
      '<span class="lb-cap"></span>'+
      '<button type="button" class="lb-close">关闭 Esc</button>'+
    '</div>'+
    '<div class="lb-stage"><img class="lb-img" alt="" tabindex="0"></div>';
  var cap=root.querySelector(".lb-cap"),
      closeBtn=root.querySelector(".lb-close"),
      stage=root.querySelector(".lb-stage"),
      img=root.querySelector(".lb-img");
  document.body.appendChild(root); /* body 直接子节点 */

  /* 锁页面滚动：记住 html/body 各自的原内联值，关闭时逐字还原，不写死成空串 */
  var htmlOv=document.documentElement.style.overflow,bodyOv=document.body.style.overflow;
  document.documentElement.style.overflow="hidden";
  document.body.style.overflow="hidden";

  var cur=seq,fitS=1,maxS=1,s=1,tx=0,ty=0,ready=false,token=0;
  function paint(){
    var t=figText(idx+1,p.name,cur,total);
    cap.textContent=t.id+" · "+t.n; /* Pinned：{编号} {案例名} · {序号} / {总数} */
    root.setAttribute("aria-label",img.alt||t.id);
  }
  function apply(){img.style.transform="translate3d("+tx.toFixed(2)+"px,"+ty.toFixed(2)+"px,0) scale("+s.toFixed(5)+")";}
  function clampPan(){
    var sw=stage.clientWidth||0,sh=stage.clientHeight||0,w=img.offsetWidth*s,h=img.offsetHeight*s;
    if(w<=sw)tx=(sw-w)/2;else tx=Math.min(0,Math.max(sw-w,tx));
    if(h<=sh)ty=(sh-h)/2;else ty=Math.min(0,Math.max(sh-h,ty));
  }
  function fit(){
    var sw=stage.clientWidth||0,sh=stage.clientHeight||0;
    var iw=img.naturalWidth||sw||1,ih=img.naturalHeight||sh||1;
    var avW=Math.max(1,sw-32),avH=Math.max(1,sh-32); /* 减去 32px 安全边（控制条高度已由 flex 扣除） */
    fitS=Math.min(avW/iw,avH/ih);
    /* 上限 = naturalWidth / 当前适应显示宽（iw*fitS）—— 恰好 100% 像素级 1:1，绝不允许超过 */
    maxS=(img.naturalWidth>0&&fitS>0&&iw>0)?(img.naturalWidth/(iw*fitS)):1;
    if(!(maxS>=1))maxS=1;
  }
  function show(){
    if(!ready)return;
    s=fitS;tx=0;ty=0;clampPan();apply();
  }
  function zoomAt(cx,cy,next){
    next=Math.min(maxS,Math.max(fitS,next)); /* 严格 clamp 在 [适应视口 1x, 100% 原始像素] */
    if(next===s)return;
    var k=next/s;
    tx=cx-(cx-tx)*k;ty=cy-(cy-ty)*k;s=next; /* 以指针为锚 */
    clampPan();apply();
  }
  function loadSeq(n){
    n=Math.max(1,Math.min(total,n)); /* 首/末张停在边界不循环 */
    cur=n;
    var it=list[n-1];
    var src=/^https?:/i.test(it[0])?it[0]:p.base+it[0]; /* 与 addFig 同一判定，逐字复用数组里的 URL */
    var alt=(it[2]!=null)?it[2]:(p.name+" 作品图 "+n);
    img.alt=alt;
    paint();
    var my=++token;
    ready=false;s=0;img.style.transform="translate3d(0,0,0) scale(1)";
    function onReady(){
      if(my!==token)return;
      ready=true;fit();show();
    }
    img.addEventListener("load",onReady);
    img.addEventListener("error",onReady); /* 失败也不留下不可见状态 */
    img.src=src; /* 打开/翻页那一刻才赋值，不预加载 46 张 */
    if(img.complete&&img.naturalWidth>0)onReady(); /* 缓存命中 */
  }
  /* 滚轮缩放：preventDefault + 指针锚点（{passive:false} 才能阻止页面滚动） */
  stage.addEventListener("wheel",function(e){
    if(!ready)return;
    e.preventDefault();
    var r=stage.getBoundingClientRect();

  /* 拖拽平移；触屏不注册任何 touch 事件、不阻止默认行为 -> 保留浏览器原生 pinch */
  var drag=null,dragMoved=false;
  function onDown(e){
    if(e.button!==0)return;
    drag={x:e.clientX,y:e.clientY,tx:tx,ty:ty};dragMoved=false;
    e.preventDefault();
  }
  function onMove(e){
    if(!drag)return;
    var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(Math.abs(dx)>2||Math.abs(dy)>2)dragMoved=true; /* 拖过就不当作「点空白关闭」 */
    tx=drag.tx+dx;ty=drag.ty+dy;clampPan();apply();
  }
  function onUp(){drag=null;}
  stage.addEventListener("mousedown",onDown);
  window.addEventListener("mousemove",onMove);
  window.addEventListener("mouseup",onUp);
  /* 关闭途径三：点击图外的 --bg 空白区（mousedown 落点判定，避开拖拽松手误关） */
  root.addEventListener("mousedown",function(e){
    root._blankDown=(e.target===root||e.target===stage);
  });
  root.addEventListener("click",function(e){
    if(!root._blankDown||dragMoved)return;
    root._blankDown=false;
    if(e.target===root||e.target===stage)lbClose();
  });
  closeBtn.addEventListener("click",function(){lbClose();}); /* 关闭途径一 */
  /* focus trap：Tab 只在「关闭」按钮与图之间循环 */
  root.addEventListener("keydown",function(e){

  });

    if(!LB||LB.root!==root)return;

    if(s<fitS)s=fitS;

  }
  window.addEventListener("resize",onResize);

  LB={root:root,trigger:trigger||null,total:total,p:p,idx:idx,cur:function(){return cur;},
    step:function(d){loadSeq(cur+d);},
    close:function(){
      token++; /* 作废在飞回调 */
      window.removeEventListener("resize",onResize);
      window.removeEventListener("mousemove",onMove); /* window 级监听逐次摸除，不随多次开关累积 */
      window.removeEventListener("mouseup",onUp);
      try{img.removeAttribute("src");}catch(err){}
      document.documentElement.style.overflow=htmlOv; /* 逐字还原原值 */
      document.body.style.overflow=bodyOv;
      if(root.parentNode)root.remove(); /* 移除整层 */
      LB=null;
      if(trigger&&trigger.isConnected){try{trigger.focus({preventScroll:true});}catch(err){try{trigger.focus();}catch(e2){}}} /* 焦点归还触发它的那个 .fig-zoom */
    }};
  try{closeBtn.focus({preventScroll:true});}catch(err){} /* 打开时焦点移入层内 */
  loadSeq(seq);
}
function lbClose(){
  if(!LB)return;
  var c=LB.close;
  LB=null;
  try{c();}catch(err){}
}
function lbStep(d){if(LB)LB.step(d);}
function lbRoot(){return LB?LB.root:null;}

    frame.addEventListener("load",function(){
      if(settled)return;
      settled=true; /* 仅凭 onload 不足以判成功（CSP 拦截时部分浏览器也触发），按 brief 既定判定：onload 且 3000ms 内 -> 保留查看器 */
      if(failTimer){clearTimeout(failTimer);failTimer=null;}
    });
    frame.src=p.pdfUrl; /* src 在 load 监听挂好之后再赋，避免缓存命中时事件早于监听 */
    v._pdfCleanup=function(){ /* cleanupView 调用：撤销定时器 + 置 settled，杜绝「用户已跳走、3 秒后回调又把旧视图改一遍」 */
      settled=true;
      if(failTimer){clearTimeout(failTimer);failTimer=null;}
    };
    var figsNode=v.querySelector(".figs");
    figsNode.parentNode.insertBefore(sec,figsNode);
    v.insertBefore(printLine,figsNode);
    finish(); /* PDF 路径下图序分屏不运行，「下一个项目」在此直接追加（state.nextAppended 守卫保证回退后不重复） */
  }else{
    startImgFlow();
  }
  return v;
}

/* ══ 路由 ══════════════════════════════════════════════ */
/* 渲染宿主：自建 <main id="viewHost">，不带任何编辑锚点属性，使运行时内容不再挂靠在被画布
   编辑层以 data-lvt-eid 锚定并做过静态快照的 #app 上（否则路由切换会被回滚成空壳）。
   CSS 不新增选择器：自建 <main> 自动继承 main{...} 标签选择器样式。 */
var appEl=document.getElementById("app");
var host=document.createElement("main");
host.id="viewHost";
host.tabIndex=-1;
if(appEl&&appEl.parentNode)appEl.parentNode.insertBefore(host,appEl);
else document.body.appendChild(host);
if(appEl){
  appEl.style.transform="";   /* 清掉编辑层残留的拖拽 inline transform（-2.25px 偏移） */
  appEl.style.display="none"; /* 退出布局，不再占用 min-height:100vh；不 remove（画布基础设施可能依赖该节点存在） */
}
/* 运行时自愈守卫：编辑层若再次给这两个节点注入 inline transform，立刻清空。
   防死循环 = 回调内做值比较（仅当值非空且不等于 "none" 才写回空串），写回后条件不再成立，
   自然收敛，无需 disconnect/重连；守卫因此可全程在线。异常一律静默降级。 */
(function(){
  if(!("MutationObserver" in window))return;
  try{
    var guard=new MutationObserver(function(records){
      try{
        for(var i=0;i<records.length;i++){
          var n=records[i].target;
          if(n!==appEl&&n!==host)continue;
          var t=n.style.transform;
          if(t&&t!=="none")n.style.transform="";
        }
      }catch(err){}
    });
    var opt={attributes:true,attributeFilter:["style","class"]};
    guard.observe(host,opt);
    if(appEl)guard.observe(appEl,opt);
  }catch(err){} /* MutationObserver 不可用或抛错 -> 不影响主流程 */
})();
var currentView=null,currentKey="",currentRoute=null;
function parseHash(){
  var h=location.hash||"#/";
  if(h==="#/"||h==="#"||h==="")return {key:"index",view:"index"};
  if(h==="#/about")return {key:"about",view:"about"};
  var m=h.match(/^#\/work\/([a-z0-9-]+)$/);
  if(m){
    for(var i=0;i<PROJECTS.length;i++)if(PROJECTS[i].slug===m[1])return {key:"work:"+m[1],view:"detail",idx:i};
  }
  return null;
}
function setTitle(r){
  if(r.view==="index")document.title="李因炘 — 品牌/文创/平面";
  else if(r.view==="about")document.title="关于 — 李因炘";
  else document.title=PROJECTS[r.idx].name+" — 李因炘";
}
function markNav(r){
  document.querySelectorAll(".navlink").forEach(function(a){
    var route=a.getAttribute("data-route");
    var cur=(route==="index"&&(r.view==="index"||r.view==="detail"))||(route==="about"&&r.view==="about");
    if(cur)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");
  });
}
function buildView(r){
  if(r.view==="index")return viewIndex();
  if(r.view==="about")return viewAbout();
  return viewDetail(PROJECTS[r.idx],r.idx);
}
function cleanupView(v){
  if(!v)return;
  lbClose(); /* Interaction fix A2：切案例 / 路由变化时主动关闭并移除放大层，不带着上一个项目的图继续浏览 */
  if(v._pdfCleanup)v._pdfCleanup(); /* PDF embed fix：先撤销 3000ms 判定定时器与 onload 回调效力，再动 DOM */
  sweep(v); /* 移除旧视图前先兜底，避免残留半隐藏状态 */
  v.querySelectorAll("[data-plx]").forEach(plxForget);
  if(rvIO)v.querySelectorAll(".rv").forEach(function(n){rvIO.unobserve(n);});
}
function render(r){
  setTitle(r);markNav(r);
  lbClose(); /* Interaction fix A3：切案例先关放大层（cleanupView 只在有旧视图时调用，此处无条件补一道） */
  currentRoute=r;
  var nv=buildView(r);
  var old=currentView;
  currentView=nv;currentKey=r.key;
  function mount(){
    host.innerHTML="";
    host.appendChild(nv);
    bindReveals(nv); /* 先于 scrollTo / .enter：.pre 在任何一次强制样式解析前落定，杜绝「先可见再被裁掉」的闪烁 */
    window.scrollTo(0,0);
    if(!REDUCED){
      nv.classList.add("enter");
      requestAnimationFrame(function(){requestAnimationFrame(function(){nv.classList.remove("enter");});});
    }
    watchPlx(nv);
    recapAll(); /* Revamp：挂载后布局落定，补算详情图的防模糊渲染宽度上限（buildView 阶段 clientWidth 为 0） */
    requestAnimationFrame(function(){requestAnimationFrame(function(){recapAll();});});
    host.focus({preventScroll:true});
  }
  if(old&&!REDUCED){
    cleanupView(old);
    old.classList.add("leave");
    setTimeout(mount,280);
  }else{
    cleanupView(old);
    mount();
  }
}
function onRoute(){
  var r=parseHash();
  if(!r){location.replace("#/");return;}
  if(r.key===currentKey)return;
  render(r);
}
window.addEventListener("hashchange",onRoute);
/* 导航兜底：捕获阶段委托 click，抵御编辑层吞掉 <a href="#/..."> 的原生跳转。
   无条件注册（与 REDUCED 无关）；href 与当前 hash 相同时不干预，保持既有行为。 */
document.addEventListener("click",function(e){
  try{
    var t=e.target;
    if(!t||!t.closest)return;
    if(t.closest(".lb"))return; /* Interaction fix：放大层内无任何路由链接，一律不干预（避开捕获阶段误处理） */
    var a=t.closest('a[href^="#/"]');
    if(!a)return;
    var href=a.getAttribute("href");
    if(!href)return;
    if(href!==location.hash){
      location.hash=href; /* 原生跳转被拦截时仍能切换路由 */
      e.preventDefault();
    }
  }catch(err){}
},{capture:true});
onRoute();

/* ══ Interaction fix A3：键盘导航（单个 document keydown，分层判定，放大层打开时优先级更高）══
   层开着：← → = 当前案例 imgs 内翻图，首/末张停在边界不循环；Esc = 关闭。
   层关着且当前在详情页：← → = 按 PROJECTS 顺序切案例、首尾循环（01↔03）；Esc 无操作。
   首页/关于页：← → 无操作（不劫持浏览器行为）。
   忽略：焦点在 input/textarea/select/contenteditable，或带 Ctrl/Meta/Alt 修饰键。
   切案例后重置：分屏状态、state.nextAppended 守卫（均随新视图重建）、放大层关闭。 */
document.addEventListener("keydown",function(e){
  try{
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    var k=e.key;
    if(k!=="ArrowLeft"&&k!=="ArrowRight"&&k!=="Escape"&&k!=="Esc")return;
    var t=e.target;
    if(t){
      var tn=(t.tagName||"").toLowerCase();
      if(tn==="input"||tn==="textarea"||tn==="select"||t.isContentEditable)return;
    }
    if(LB){ /* 放大层开着：优先级更高 */
      if(k==="Escape"||k==="Esc"){e.preventDefault();lbClose();}
      else{e.preventDefault();lbStep(k==="ArrowRight"?1:-1);}
      return;
    }
    if(k==="Escape"||k==="Esc")return; /* 层关着时 Esc 无操作 */
    if(!currentRoute||currentRoute.view!=="detail")return; /* 首页/关于页不响应 */
    e.preventDefault();
    var n=PROJECTS.length;
    var ni=((currentRoute.idx+(k==="ArrowRight"?1:-1))%n+n)%n; /* 首尾循环 01↔03 */
    location.hash="#/work/"+PROJECTS[ni].slug;
  }catch(err){}
});

/* ══ 自定义光标（仅 pointer:fine） ═════════════════════ */
(function(){
  if(REDUCED)return;
  if(!window.matchMedia("(pointer: fine)").matches)return;
  var cur=document.getElementById("cursor");
  var tx=innerWidth/2,ty=innerHeight/2,x=tx,y=ty,last=performance.now();
  window.addEventListener("pointermove",function(e){tx=e.clientX;ty=e.clientY;},{passive:true});
  function loop(now){
    var dt=Math.min(0.05,(now-last)/1000);last=now;
    var k=1-Math.exp(-dt/0.12);
    x+=(tx-x)*k;y+=(ty-y)*k;
    cur.style.transform="translate3d("+(x-cur.offsetWidth/2)+"px,"+(y-cur.offsetHeight/2)+"px,0)";
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  function setState(target){
    var isLink=!!(target&&target.closest&&target.closest("a,button,[data-cursor]"));
    var isView=!!(target&&target.closest&&target.closest('[data-cursor="view"]'));
    var isZoom=!!(target&&target.closest&&target.closest('[data-cursor="zoom"]')); /* Interaction fix A1：放大态 */
    cur.classList.toggle("big",isLink);
    cur.querySelector("span").style.opacity=isView?"1":"0";
    var zw=cur.querySelector(".cur-zoom");
    if(zw)zw.style.opacity=isZoom?"1":"0";
  }
  document.addEventListener("mouseover",function(e){setState(e.target);});
  document.addEventListener("mouseout",function(e){if(!e.relatedTarget)setState(null);});
})();
</script>
